<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppet Theater — Motion Puppet Theater</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Control Bar -->
      <header class="control-panel">
        <div class="brand">
          <h1 class="title">Puppet Theater</h1>
          <span id="fps-badge" class="fps-badge">-- FPS</span>
          <span id="rec-badge" class="rec-badge hidden">REC 00:00</span>
        </div>

        <div class="control-group">
          <button id="btn-camera" class="btn btn-primary" title="Spustit/zastavit kameru">Kamera</button>
          <button id="btn-record" class="btn btn-danger" title="Zapnout/zastavit nahrávání videa plátna do souboru">Nahrávat</button>
          <button id="btn-toggle-debug" class="btn btn-secondary" title="Ukázat/skrýt detekční kostru">Debug</button>
          <button id="btn-toggle-freeze" class="btn btn-secondary" title="Zamknout/odemknout pohyb loutek">Pohyb</button>
          <button id="btn-toggle-theremin" class="btn btn-secondary" title="Zapnout/vypnout Theremin zvuk">Theremin</button>
          <button id="btn-sim" class="btn btn-secondary" title="Simulace rukou bez kamery (tělo = myš, paže = animace)">Simulace</button>
          <a href="./builder.html" class="btn btn-secondary" title="Sestavit vlastní vystřihovánkovou loutku">Builder</a>
          <button id="btn-stop-motion" class="btn btn-secondary" title="Přepnout do stop-motion režimu (snímání po snímcích)">Stop-motion</button>
        </div>

        <div class="control-group">
          <label for="select-left-puppet" class="compact-label">L1:</label>
          <select id="select-left-puppet" class="select-input">
            <option value="fox" selected>Liška</option>
            <option value="robot">Robot</option>
            <option value="none">Prázdné</option>
          </select>
          <label class="file-upload-btn btn-secondary" title="Nahrát vlastní PNG loutku">
            PNG
            <input type="file" id="upload-left-closed" accept="image/*" />
          </label>
        </div>

        <div class="control-group">
          <label for="select-right-puppet" class="compact-label">L2:</label>
          <select id="select-right-puppet" class="select-input">
            <option value="robot" selected>Robot</option>
            <option value="fox">Liška</option>
            <option value="none">Prázdné</option>
          </select>
          <label class="file-upload-btn btn-secondary" title="Nahrát vlastní PNG loutku">
            PNG
            <input type="file" id="upload-right-closed" accept="image/*" />
          </label>
        </div>

        <div class="control-group">
          <label for="bg-color" class="compact-label">Scéna:</label>
          <select id="bg-color" class="select-input">
            <option value="0x1e1e2e">Tmavá</option>
            <option value="0x2d3748">Břidlice</option>
            <option value="0x1a202c">Černá</option>
            <option value="0x2b6cb0">Modrá</option>
            <option value="0x2f855a">Zelená</option>
          </select>
          <label class="file-upload-btn btn-secondary" title="Nahrát vlastní obrázek pozadí">
            Pozadí
            <input type="file" id="upload-bg" accept="image/*" />
          </label>
        </div>
      </header>

      <!-- Main Stage Container -->
      <main class="stage-container">
        <!-- PixiJS Canvas Parent -->
        <div id="pixi-viewport">
          <canvas id="sm-onion-canvas" class="sm-onion-canvas"></canvas>
        </div>

        <!-- Hidden Video Element for MediaPipe input -->
        <video id="webcam-video" playsinline muted style="display: none;"></video>

        <!-- Debug Canvas Overlay for Landmarks -->
        <canvas id="debug-canvas" class="debug-overlay"></canvas>

        <!-- Stop-Motion Playback Overlay (on top of the stage) -->
        <canvas id="sm-play-canvas" class="sm-play-canvas"></canvas>

        <!-- Status Banner -->
        <div id="status-banner" class="status-banner hidden"></div>

        <!-- Stop-Motion Timeline Panel -->
        <section id="sm-panel" class="sm-panel hidden">
          <div class="sm-controls">
            <button id="sm-btn-snap" class="btn btn-danger" title="Uložit aktuální scénu jako snímek">Snímek</button>
            <button id="sm-btn-delete" class="btn btn-secondary" title="Smazat vybraný snímek" disabled>Smazat</button>
            <button id="sm-btn-duplicate" class="btn btn-secondary" title="Duplikovat vybraný snímek" disabled>Duplikovat</button>
            <button id="sm-btn-left" class="btn btn-secondary" title="Posunout snímek doleva" disabled>&larr;</button>
            <button id="sm-btn-right" class="btn btn-secondary" title="Posunout snímek doprava" disabled>&rarr;</button>
            <button id="sm-btn-play" class="btn btn-secondary" title="Přehrát snímky" disabled>Přehrát</button>
            <label class="compact-label" for="sm-fps">FPS</label>
            <select id="sm-fps" class="select-input">
              <option value="12">12</option>
              <option value="24" selected>24</option>
            </select>
            <button id="sm-btn-onion" class="btn btn-secondary" title="Zapnout/vypnout průsvitný duch předchozího snímku">Onion</button>
            <span class="sm-separator"></span>
            <button id="sm-btn-export-webm" class="btn btn-secondary" title="Vyexportovat animaci jako WebM video" disabled>WebM</button>
            <button id="sm-btn-export-gif" class="btn btn-secondary" title="Vyexportovat animaci jako GIF" disabled>GIF</button>
            <button id="sm-btn-export-zip" class="btn btn-secondary" title="Stáhnout snímky jako PNG v ZIP archivu" disabled>PNG (ZIP)</button>
          </div>
          <div class="sm-controls">
            <label class="compact-label">Pozadí:</label>
            <button id="sm-btn-green" class="btn btn-secondary" title="Vyplnit scénu klíčovací zelenou (chroma)">Zelená</button>
            <label class="file-upload-btn btn-secondary" title="Nahrát dlouhý pruh pozadí (posouvá se posuvníkem / krokem na snímek)">
              Pruh
              <input type="file" id="sm-upload-strip" accept="image/*" />
            </label>
            <button id="sm-btn-reset-bg" class="btn btn-secondary" title="Vrátit výchozí pozadí">Výchozí</button>
            <input type="range" id="sm-pan" class="sm-pan-slider" min="0" max="4000" value="0" title="Ruční posun okna pruhu" disabled />
            <label class="compact-label" for="sm-pan-step">Krok:</label>
            <input type="number" id="sm-pan-step" class="sm-pan-step" value="0" min="0" step="1" title="Auto-posuv okna pruhu v px po každém uloženém snímku" />
          </div>
          <div id="sm-frame-strip" class="sm-frame-strip"></div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
