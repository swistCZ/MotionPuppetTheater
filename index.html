<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web-Based Motion Puppet Theater</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top Control Bar -->
      <header class="control-panel">
        <h1 class="title">🎭 Motion Puppet Theater</h1>
        
        <div class="control-group">
          <button id="btn-camera" class="btn btn-primary">📷 Spustit Kameru</button>
          <button id="btn-toggle-debug" class="btn btn-secondary">🔍 Debug Overlay</button>
          <button id="btn-toggle-freeze" class="btn btn-secondary">🔓 Pohyb Aktivní</button>
          <button id="btn-toggle-theremin" class="btn btn-secondary">🎵 Theremin Vypnut</button>
        </div>

        <div class="control-group">
          <label for="select-left-puppet">Loutka 1 (Levá):</label>
          <select id="select-left-puppet" class="select-input">
            <option value="dragon">🐲 Drak / Monstrum</option>
            <option value="bunny">🐰 Králíček</option>
            <option value="fox">🦊 Liška</option>
            <option value="robot">🤖 Robot</option>
            <option value="cat">🐱 Kočka / Tygr</option>
          </select>
          <label class="file-upload-btn btn-secondary">
            🖼️ PNG
            <input type="file" id="upload-left-closed" accept="image/*" title="Vlastní PNG obrázek loutky" />
          </label>
        </div>

        <div class="control-group">
          <label for="select-right-puppet">Loutka 2 (Pravá):</label>
          <select id="select-right-puppet" class="select-input">
            <option value="bunny" selected>🐰 Králíček</option>
            <option value="dragon">🐲 Drak / Monstrum</option>
            <option value="fox">🦊 Liška</option>
            <option value="robot">🤖 Robot</option>
            <option value="cat">🐱 Kočka / Tygr</option>
          </select>
          <label class="file-upload-btn btn-secondary">
            🖼️ PNG
            <input type="file" id="upload-right-closed" accept="image/*" title="Vlastní PNG obrázek loutky" />
          </label>
        </div>

        <div class="control-group">
          <label for="bg-color">Pozadí:</label>
          <select id="bg-color" class="select-input">
            <option value="0x1e1e2e">Tmavé</option>
            <option value="0x2d3748">Břidlicové</option>
            <option value="0x1a202c">Černé</option>
            <option value="0x2b6cb0">Modré Scénické</option>
            <option value="0x2f855a">Zelená Scéna</option>
          </select>
          <label class="file-upload-btn btn-secondary">
            🖼️ Vlastní Pozadí
            <input type="file" id="upload-bg" accept="image/*" />
          </label>
        </div>
      </header>

      <!-- Main Stage Container -->
      <main class="stage-container">
        <!-- PixiJS Canvas Parent -->
        <div id="pixi-viewport"></div>

        <!-- Hidden Video Element for MediaPipe input -->
        <video id="webcam-video" playsinline muted style="display: none;"></video>

        <!-- Debug Canvas Overlay for Landmarks -->
        <canvas id="debug-canvas" class="debug-overlay"></canvas>

        <!-- Info / Error Banner -->
        <div id="status-banner" class="status-banner hidden"></div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
