<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="inkRough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#inkRough2)">
    <!-- Long War Poleaxe / Battle Axe Shaft -->
    <path d="M 60 20 L 140 270" stroke="#4a3525" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Crescent Steel Axe Blade with Back Spike -->
    <path d="M 50 45 C 20 20, 25 90, 40 100 C 55 95, 60 70, 75 60 C 65 50, 55 48, 50 45 Z" fill="#8d9aa6" stroke="#1f1813" stroke-width="3"/>
    <path d="M 75 55 L 105 50 L 78 68 Z" fill="#6f7c87" stroke="#1f1813" stroke-width="2.5"/> <!-- Back spike -->
    <circle cx="62" cy="62" r="3" fill="#1f1813"/>

    <!-- Hind Legs (Bipedal marching posture) -->
    <path d="M 120 200 C 105 210, 95 235, 105 255 C 110 262, 125 260, 130 252 C 132 238, 138 215, 135 200 Z" fill="#9e9387" stroke="#1f1813" stroke-width="3"/>
    <path d="M 105 255 L 92 258 M 108 260 L 98 266 M 115 262 L 108 270" stroke="#1f1813" stroke-width="2.5" stroke-linecap="round"/> <!-- Claws -->

    <path d="M 155 195 C 165 205, 175 228, 168 250 C 162 260, 148 262, 142 252 C 145 238, 150 215, 148 195 Z" fill="#8a8075" stroke="#1f1813" stroke-width="3"/>
    <path d="M 168 250 L 178 255 M 165 255 L 174 262 M 158 258 L 165 268" stroke="#1f1813" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Fluffy White Scut (Tail) -->
    <path d="M 175 175 C 190 170, 195 185, 185 192 C 178 192, 175 185, 175 175 Z" fill="#e8e2d8" stroke="#1f1813" stroke-width="2.5"/>

    <!-- Body in Quartered Heraldic Tabard (Vermilion & Gold) -->
    <path d="M 115 130 C 105 155, 110 185, 120 205 C 145 210, 165 205, 170 185 C 175 160, 170 135, 155 125 Z" fill="#c9381e" stroke="#1f1813" stroke-width="3.5"/>
    <path d="M 142 126 L 145 208 C 158 206, 168 195, 170 185 C 175 160, 170 135, 155 125 Z" fill="#e5ad24" stroke="#1f1813" stroke-width="2"/>
    <!-- Heraldic Lion Motif on Tabard -->
    <path d="M 125 155 Q 132 150 135 158 Q 128 168 135 175" fill="none" stroke="#e5ad24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 155 Q 158 150 162 158 Q 155 168 162 175" fill="none" stroke="#c9381e" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Arm Holding Shield -->
    <path d="M 152 140 C 170 142, 188 150, 182 165 C 175 170, 160 162, 150 152 Z" fill="#9e9387" stroke="#1f1813" stroke-width="2.8"/>
    
    <!-- Round Medieval Buckler Shield with Iron Boss -->
    <circle cx="190" cy="155" r="28" fill="#1b3f8b" stroke="#1f1813" stroke-width="3"/>
    <circle cx="190" cy="155" r="18" fill="#d94e24" stroke="#1f1813" stroke-width="2"/>
    <circle cx="190" cy="155" r="8" fill="#d8b248" stroke="#1f1813" stroke-width="2.5"/>
    <circle cx="190" cy="155" r="3" fill="#1f1813"/>

    <!-- Right Arm Gripping Axe Handle -->
    <path d="M 120 140 C 95 130, 80 115, 75 105 C 72 108, 75 118, 88 128 C 100 138, 112 145, 120 140 Z" fill="#9e9387" stroke="#1f1813" stroke-width="2.8"/>
    <circle cx="75" cy="108" r="6" fill="#e8e2d8" stroke="#1f1813" stroke-width="2"/> <!-- Paw gripping handle -->

    <!-- Head & Expressive Grim Medieval Face -->
    <path d="M 132 125 C 115 118, 105 100, 110 82 C 115 68, 132 58, 148 65 C 160 72, 165 92, 155 110 C 148 122, 140 126, 132 125 Z" fill="#9e9387" stroke="#1f1813" stroke-width="3.2"/>

    <!-- Googly Black Ring Eye -->
    <circle cx="128" cy="80" r="8.5" fill="#ffffff" stroke="#1f1813" stroke-width="2.5"/>
    <circle cx="126" cy="80" r="4.5" fill="#1f1813"/>
    <circle cx="124" cy="78" r="1.5" fill="#ffffff"/>

    <!-- Buck Teeth & Snarling Snout -->
    <path d="M 110 85 C 102 88, 102 96, 112 98 Z" fill="#e8e2d8" stroke="#1f1813" stroke-width="2"/>
    <rect x="108" y="96" width="4" height="6" fill="#ffffff" stroke="#1f1813" stroke-width="1.5"/>
    <rect x="113" y="96" width="4" height="6" fill="#ffffff" stroke="#1f1813" stroke-width="1.5"/>

    <!-- Long Pricked Medieval Ears with Crosshatching -->
    <path d="M 135 65 C 128 40, 130 15, 145 2 C 155 18, 152 45, 145 65 Z" fill="#9e9387" stroke="#1f1813" stroke-width="3"/>
    <path d="M 138 58 C 134 40, 136 20, 144 10 C 148 20, 146 42, 142 56 Z" fill="#dca898" stroke="#1f1813" stroke-width="1.5"/>
    
    <path d="M 148 66 C 158 48, 175 22, 192 10 C 190 28, 175 55, 155 70 Z" fill="#8a8075" stroke="#1f1813" stroke-width="2.8"/>
    <path d="M 154 60 C 162 45, 175 28, 185 18 C 182 32, 170 50, 158 62 Z" fill="#dca898" stroke="#1f1813" stroke-width="1.5"/>
  </g>
</svg>
