<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="inkRough4" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#inkRough4)">
    <!-- Slithering Snail Flesh Base -->
    <path d="M 40 235 C 75 220, 115 225, 140 230 C 180 235, 235 240, 260 220 C 275 235, 255 255, 210 258 C 150 262, 70 265, 35 248 C 30 240, 32 238, 40 235 Z" fill="#d2c39e" stroke="#1f1813" stroke-width="3"/>
    
    <!-- Snail Eyestalks with Googly Eyes -->
    <path d="M 42 235 C 32 215, 25 190, 15 178" stroke="#1f1813" stroke-width="4" stroke-linecap="round"/>
    <circle cx="14" cy="176" r="6.5" fill="#ffffff" stroke="#1f1813" stroke-width="2.5"/>
    <circle cx="14" cy="176" r="3" fill="#1f1813"/>

    <path d="M 55 232 C 48 210, 42 185, 38 170" stroke="#1f1813" stroke-width="4" stroke-linecap="round"/>
    <circle cx="38" cy="168" r="6.5" fill="#ffffff" stroke="#1f1813" stroke-width="2.5"/>
    <circle cx="38" cy="168" r="3" fill="#1f1813"/>

    <!-- Large Spiral Nautilus Shell with Golden Filigree -->
    <path d="M 125 155 C 130 115, 175 105, 210 120 C 245 135, 260 185, 235 225 C 205 260, 150 255, 125 225 C 105 200, 115 170, 125 155 Z" fill="#2d4f82" stroke="#1f1813" stroke-width="3.5"/>
    
    <!-- Spiral Ridge Lines -->
    <path d="M 135 168 C 145 138, 180 130, 205 142 C 228 155, 235 192, 218 218 C 198 242, 162 238, 148 215 C 138 198, 145 180, 158 175 C 170 170, 188 175, 192 188 C 195 202, 182 212, 170 208" fill="none" stroke="#e0b83e" stroke-width="3" stroke-linecap="round"/>

    <!-- Armored Medieval Knight Torso Emerging from Shell -->
    <path d="M 90 180 C 85 145, 95 120, 115 105 C 130 110, 140 125, 145 155 C 130 178, 105 185, 90 180 Z" fill="#8d9aa6" stroke="#1f1813" stroke-width="3.5"/>
    <path d="M 102 110 L 105 178 M 120 112 L 122 175 M 100 135 L 135 135 M 95 155 L 140 155" stroke="#485563" stroke-width="2"/> <!-- Plate rivets & lines -->

    <!-- Broadsword in Gauntlet -->
    <path d="M 105 150 L 55 120" stroke="#8d9aa6" stroke-width="3"/> <!-- Arm -->
    <path d="M 45 110 L 15 35" stroke="#cfd7de" stroke-width="5" stroke-linecap="round"/> <!-- Blade -->
    <path d="M 45 110 L 15 35" stroke="#1f1813" stroke-width="1.5"/>
    <path d="M 40 100 L 55 118" stroke="#d8a82c" stroke-width="4" stroke-linecap="round"/> <!-- Crossguard -->
    <circle cx="58" cy="122" r="4.5" fill="#d8a82c" stroke="#1f1813" stroke-width="1.5"/> <!-- Pommel -->

    <!-- Heraldic Heater Shield (Red/Gold Checkered) -->
    <path d="M 125 120 L 168 102 C 180 130, 172 165, 150 182 C 132 172, 122 150, 125 120 Z" fill="#c9381e" stroke="#1f1813" stroke-width="3"/>
    <path d="M 125 120 L 148 110 L 142 145 L 123 148 Z M 148 110 L 168 102 L 162 135 L 142 145 Z M 142 145 L 162 135 L 150 182 L 135 168 Z" fill="#dca926" stroke="#1f1813" stroke-width="1.5"/>

    <!-- Great Helm / Bascinet Helmet with Eye Slit & Plume -->
    <path d="M 102 105 C 98 75, 110 58, 128 58 C 145 58, 155 75, 150 105 C 138 112, 115 112, 102 105 Z" fill="#8d9aa6" stroke="#1f1813" stroke-width="3.5"/>
    
    <!-- Visor Cross Eye-Slit -->
    <rect x="108" y="78" width="30" height="4.5" rx="2" fill="#1f1813"/>
    <rect x="121" y="72" width="4.5" height="18" rx="2" fill="#1f1813"/>
    
    <!-- Red Feather Plume -->
    <path d="M 128 58 C 122 35, 140 18, 168 12 C 160 28, 152 42, 138 52 Z" fill="#c9381e" stroke="#1f1813" stroke-width="2.5"/>
    <path d="M 132 55 C 135 32, 158 22, 182 18 C 168 38, 155 50, 142 56 Z" fill="#e55338" stroke="#1f1813" stroke-width="2"/>
  </g>
</svg>
