<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="inkRough3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#inkRough3)">
    <!-- Webbed Hind Legs -->
    <path d="M 85 190 C 50 195, 30 225, 45 255 C 55 265, 75 258, 85 240 C 95 220, 100 200, 85 190 Z" fill="#527d42" stroke="#1f1813" stroke-width="3"/>
    <path d="M 45 255 L 28 265 M 50 262 L 38 274 M 60 264 L 52 278" stroke="#1f1813" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 215 190 C 250 195, 270 225, 255 255 C 245 265, 225 258, 215 240 C 205 220, 200 200, 215 190 Z" fill="#426b34" stroke="#1f1813" stroke-width="3"/>
    <path d="M 255 255 L 272 265 M 250 262 L 262 274 M 240 264 L 248 278" stroke="#1f1813" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Plump Frog Body with Mottled Olive/Ochre Texture -->
    <ellipse cx="150" cy="185" rx="65" ry="55" fill="#5b8c49" stroke="#1f1813" stroke-width="3.5"/>
    <ellipse cx="150" cy="190" rx="42" ry="38" fill="#dfcf96" stroke="#1f1813" stroke-width="2"/> <!-- Belly -->
    
    <!-- Mottled Spots -->
    <circle cx="120" cy="165" r="4" fill="#325225"/>
    <circle cx="178" cy="168" r="5" fill="#325225"/>
    <circle cx="132" cy="205" r="4.5" fill="#a48c48"/>
    <circle cx="168" cy="208" r="4" fill="#a48c48"/>
    <circle cx="112" cy="188" r="3.5" fill="#325225"/>

    <!-- Left Arm Holding Golden Royal Orb (Globus Cruciger) -->
    <path d="M 95 165 C 75 168, 62 180, 68 198 C 75 205, 90 198, 98 185 Z" fill="#527d42" stroke="#1f1813" stroke-width="2.8"/>
    <circle cx="65" cy="205" r="14" fill="#d8a82c" stroke="#1f1813" stroke-width="2.5"/>
    <path d="M 65 191 L 65 183 M 60 186 L 70 186" stroke="#1f1813" stroke-width="2.5" stroke-linecap="round"/> <!-- Cross -->
    <circle cx="65" cy="205" r="4" fill="#9e241c"/>

    <!-- Right Arm Holding Scepter with Fleur-de-lis -->
    <path d="M 205 165 C 225 168, 238 180, 232 198 C 225 205, 210 198, 202 185 Z" fill="#426b34" stroke="#1f1813" stroke-width="2.8"/>
    <path d="M 235 225 L 235 155" stroke="#d8a82c" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 235 155 C 228 145, 222 138, 235 125 C 248 138, 242 145, 235 155 Z" fill="#d8a82c" stroke="#1f1813" stroke-width="2"/>
    <path d="M 225 142 C 220 148, 225 155, 235 150 C 245 155, 250 148, 245 142" fill="none" stroke="#1f1813" stroke-width="2"/>

    <!-- Elizabethan / Medieval White Pleated Ruff Collar -->
    <path d="M 98 140 C 105 130, 195 130, 202 140 C 208 152, 190 160, 150 162 C 110 160, 92 152, 98 140 Z" fill="#f4ede2" stroke="#1f1813" stroke-width="3"/>
    <path d="M 108 140 Q 112 155 116 142 Q 120 156 124 142 Q 128 156 132 142 Q 136 156 140 142 Q 144 156 148 142 Q 152 156 156 142 Q 160 156 164 142 Q 168 156 172 142 Q 176 156 180 142 Q 184 156 188 142 Q 192 155 196 140" fill="none" stroke="#1f1813" stroke-width="2"/>

    <!-- Frog Head -->
    <path d="M 92 120 C 85 95, 115 75, 150 78 C 185 75, 215 95, 208 120 C 200 142, 100 142, 92 120 Z" fill="#5b8c49" stroke="#1f1813" stroke-width="3.5"/>

    <!-- Bulging Bulbous Googly Eyes on Top of Head -->
    <circle cx="118" cy="76" r="18" fill="#5b8c49" stroke="#1f1813" stroke-width="3"/>
    <circle cx="118" cy="76" r="12" fill="#ffffff" stroke="#1f1813" stroke-width="2"/>
    <circle cx="118" cy="76" r="6" fill="#1f1813"/>
    <circle cx="115" cy="73" r="2" fill="#ffffff"/>

    <circle cx="182" cy="76" r="18" fill="#5b8c49" stroke="#1f1813" stroke-width="3"/>
    <circle cx="182" cy="76" r="12" fill="#ffffff" stroke="#1f1813" stroke-width="2"/>
    <circle cx="182" cy="76" r="6" fill="#1f1813"/>
    <circle cx="179" cy="73" r="2" fill="#ffffff"/>

    <!-- Wide Smug Gaping Mouth -->
    <path d="M 102 118 Q 150 135 198 118" fill="none" stroke="#1f1813" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 100 115 C 98 122, 105 125, 106 118 M 200 115 C 202 122, 195 125, 194 118" stroke="#1f1813" stroke-width="2.5"/>

    <!-- Ornate Gothic Imperial Gold Crown with Jewels -->
    <path d="M 125 65 L 120 30 L 135 48 L 150 20 L 165 48 L 180 30 L 175 65 Z" fill="#dca926" stroke="#1f1813" stroke-width="3" stroke-linejoin="round"/>
    <rect x="123" y="58" width="54" height="8" fill="#b98516" stroke="#1f1813" stroke-width="2"/>
    <circle cx="132" cy="62" r="2.5" fill="#a4261c"/> <!-- Ruby -->
    <circle cx="150" cy="62" r="3" fill="#244b82"/> <!-- Sapphire -->
    <circle cx="168" cy="62" r="2.5" fill="#2b7a3e"/> <!-- Emerald -->
  </g>
</svg>
