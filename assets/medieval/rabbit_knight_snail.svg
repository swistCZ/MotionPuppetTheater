<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Parchment Tempera Filter for authentic ink & watercolor look -->
    <filter id="inkRough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#inkRough)">
    <!-- Snail Human Neck & Body -->
    <path d="M 120 180 C 95 180, 80 205, 60 215 C 45 222, 35 220, 30 210 C 25 195, 45 185, 65 175 C 85 165, 105 170, 120 180 Z" fill="#eed9c4" stroke="#221b15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Red/Orange Ribbed Collar on Snail -->
    <path d="M 115 175 C 125 170, 140 175, 145 190 C 135 205, 120 205, 110 195 Z" fill="#d3381c" stroke="#221b15" stroke-width="3"/>
    <path d="M 118 178 L 115 195 M 125 175 L 122 198 M 132 176 L 130 200 M 139 180 L 137 197" stroke="#8a1f0c" stroke-width="2"/>

    <!-- Snail Shell (Spiral Ribbed Red/Orange) -->
    <path d="M 135 185 C 135 150, 175 140, 205 155 C 235 170, 240 215, 215 245 C 190 275, 140 270, 125 240 C 115 220, 120 195, 135 185 Z" fill="#d94e24" stroke="#221b15" stroke-width="3.5"/>
    
    <!-- Snail Shell Inner Spiral -->
    <path d="M 145 195 C 150 170, 180 165, 198 175 C 218 185, 222 215, 205 235 C 188 255, 155 250, 145 230 C 138 215, 142 200, 152 195 C 162 190, 178 192, 182 202 C 185 212, 178 222, 168 220 C 160 218, 160 208, 165 206" fill="none" stroke="#221b15" stroke-width="3" stroke-linecap="round"/>

    <!-- Snail Shell Ridges/Ribs -->
    <path d="M 140 165 L 132 155 M 155 153 L 152 140 M 175 148 L 178 135 M 195 152 L 202 140 M 215 163 L 228 155 M 230 180 L 245 178 M 235 200 L 250 205 M 230 222 L 245 232 M 215 242 L 225 255 M 195 255 L 200 268 M 172 258 L 170 272 M 150 252 L 145 265 M 132 238 L 122 248" stroke="#8a1f0c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Human Head (Tonsured Bald Monk with Blue Beard) -->
    <!-- Face / Head -->
    <path d="M 65 175 C 60 160, 40 160, 32 170 C 25 180, 20 200, 30 215 C 38 222, 52 220, 60 215 Z" fill="#edd5be" stroke="#221b15" stroke-width="3"/>
    
    <!-- Bald Tonsure Fringe (Grey-Blue Hair) -->
    <path d="M 58 168 C 50 162, 38 165, 34 172 C 30 178, 32 185, 30 190 C 35 185, 42 180, 52 182 C 58 180, 62 175, 58 168 Z" fill="#4a6984" stroke="#221b15" stroke-width="2"/>

    <!-- Stoic Eye, Brow & Long Aquiline Nose -->
    <path d="M 42 182 Q 40 188 35 192 L 42 195" fill="none" stroke="#221b15" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="45" cy="184" r="2.5" fill="#221b15"/>
    <path d="M 40 179 Q 46 177 49 181" fill="none" stroke="#221b15" stroke-width="2"/>
    <path d="M 37 202 Q 42 200 46 203" fill="none" stroke="#221b15" stroke-width="2"/> <!-- Closed mouth -->

    <!-- Long Flowing Blue/Indigo Beard -->
    <path d="M 28 205 C 18 220, 15 240, 22 255 C 26 262, 32 260, 36 248 C 40 238, 48 225, 48 215 C 40 215, 32 210, 28 205 Z" fill="#32527b" stroke="#221b15" stroke-width="2.5"/>
    <path d="M 25 215 C 22 230, 24 245, 28 252 M 32 218 C 30 232, 34 242, 36 248 M 40 220 C 38 230, 42 238, 44 242" stroke="#5a82b0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Jousting Lance (Spear resting horizontally) -->
    <path d="M 10 145 L 290 145" stroke="#221b15" stroke-width="3" stroke-linecap="round"/>
    <path d="M 10 145 L 35 138 L 35 152 Z" fill="#88929a" stroke="#221b15" stroke-width="2"/>

    <!-- Medieval Grey Hare (Rabbit Knight) -->
    <!-- Rabbit Body / Torso -->
    <path d="M 148 185 C 145 160, 150 140, 160 125 C 170 120, 185 125, 188 145 C 190 165, 182 185, 175 195 C 165 195, 152 192, 148 185 Z" fill="#a49a8f" stroke="#221b15" stroke-width="3"/>
    
    <!-- Fluffy White Tail -->
    <path d="M 185 165 C 195 162, 200 172, 192 178 C 188 178, 185 172, 185 165 Z" fill="#e8e2d8" stroke="#221b15" stroke-width="2"/>

    <!-- Rabbit Hind Leg on Snail Shell -->
    <path d="M 165 170 C 172 175, 175 192, 168 205 C 162 215, 150 218, 145 215 C 140 210, 145 200, 155 198 Z" fill="#91877c" stroke="#221b15" stroke-width="2.5"/>
    <path d="M 145 215 L 138 216 M 146 218 L 140 222 M 149 220 L 145 225" stroke="#221b15" stroke-width="2" stroke-linecap="round"/> <!-- Claws -->

    <!-- Rabbit Arms Holding Lance & Shield -->
    <path d="M 148 140 C 135 142, 120 148, 105 145 C 98 145, 96 150, 102 153 C 115 155, 130 150, 145 148 Z" fill="#a49a8f" stroke="#221b15" stroke-width="2.5"/>
    <path d="M 102 145 C 98 140, 92 142, 95 148 C 98 152, 104 150, 102 145 Z" fill="#e8e2d8" stroke="#221b15" stroke-width="2"/> <!-- Paw gripping lance -->

    <!-- Iconic Blue Heraldic Heater Shield -->
    <path d="M 130 105 L 185 85 C 195 115, 190 145, 170 165 C 150 155, 132 135, 130 105 Z" fill="#1b3f8b" stroke="#221b15" stroke-width="3"/>
    
    <!-- White Heraldic Foliage / Lines on Shield -->
    <path d="M 134 108 L 180 90 M 138 116 L 175 102 M 142 124 L 170 114 M 146 132 L 165 126 M 150 140 L 160 138" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 158 95 L 158 148 M 150 108 Q 158 115 166 108 M 152 125 Q 158 132 164 125" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rabbit Neck & Head -->
    <path d="M 155 125 C 145 120, 138 105, 140 92 C 142 80, 155 70, 168 75 C 178 80, 180 95, 175 110 C 170 120, 162 125, 155 125 Z" fill="#a49a8f" stroke="#221b15" stroke-width="3"/>

    <!-- Wide Googly Black-Ringed Eye -->
    <circle cx="156" cy="85" r="9" fill="#ffffff" stroke="#221b15" stroke-width="2.5"/>
    <circle cx="156" cy="85" r="4.5" fill="#221b15"/>
    <circle cx="154" cy="83" r="1.5" fill="#ffffff"/> <!-- Highlight -->

    <!-- Snout, Whiskers & Mouth -->
    <path d="M 140 92 C 134 94, 132 98, 138 102 C 144 104, 148 100, 145 95 Z" fill="#e8e2d8" stroke="#221b15" stroke-width="2"/>
    <path d="M 132 95 L 120 92 M 132 99 L 118 100 M 134 103 L 122 108" stroke="#221b15" stroke-width="1.5" stroke-linecap="round"/> <!-- Whiskers -->

    <!-- Long Pointed Upright Medieval Ears -->
    <path d="M 160 75 C 158 55, 168 25, 185 10 C 190 25, 185 55, 172 75 Z" fill="#a49a8f" stroke="#221b15" stroke-width="3"/>
    <path d="M 166 70 C 165 52, 172 30, 182 18 C 185 28, 180 50, 172 68 Z" fill="#ddb3a4" stroke="#221b15" stroke-width="1.5"/>

    <path d="M 168 76 C 175 60, 195 35, 215 22 C 215 38, 200 65, 178 80 Z" fill="#91877c" stroke="#221b15" stroke-width="2.8"/>
    <path d="M 174 72 C 180 55, 198 38, 210 28 C 208 42, 194 62, 180 75 Z" fill="#ddb3a4" stroke="#221b15" stroke-width="1.5"/>

    <!-- Subtle Medieval Ink Dots / Shading on Fur -->
    <circle cx="150" cy="115" r="1" fill="#221b15"/>
    <circle cx="154" cy="118" r="1" fill="#221b15"/>
    <circle cx="148" cy="122" r="1" fill="#221b15"/>
  </g>
</svg>
